[project]
name = "wagtail-ninja"
version = "0.2b2"
description = "Ninja API for Wagtail"
requires-python = ">=3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme="README.md"

dependencies = [
    "django",
    "django-ninja>=1.4.3,<=1.7",
]

[dependency-groups]
dev = [
    "django-stubs>=5.2.2",
    "icecream>=2.1.5",
    "orjson>=3.11.2",
    "ruff>=0.12.1",
    "wagtail>=7.0.1",
    "wagtail-headless-preview>=0.8.0",
]


[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"
